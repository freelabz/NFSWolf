[package]
edition = "2024"
rust-version = "1.95"
name = "nfswolf"
version = "1.2.0"
build = false
include = [
    "/src/**/*",
    "/tests/**/*",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure-Rust NFS (v2/v3/v4) security toolkit: recon, analysis, export-escape, FUSE mount, and an interactive shell for authorized red-team and pentest work."
homepage = "https://strongwind.dev/NFSWolf"
documentation = "https://github.com/StrongWind1/NFSWolf/tree/main/docs"
readme = "README.md"
keywords = [
    "nfs",
    "security",
    "pentest",
    "scanner",
    "rpc",
]
categories = [
    "command-line-utilities",
    "network-programming",
    "filesystem",
]
license = "Apache-2.0"
repository = "https://github.com/StrongWind1/NFSWolf"

[features]
auth-dh = ["onc-rpc-client/auth-dh"]
default = ["fuse"]
fuse = ["dep:fuser"]

[[bin]]
name = "nfswolf"
path = "src/main.rs"

[[test]]
name = "analyzer_test"
path = "tests/integration/analyzer_test.rs"

[[test]]
name = "credential_test"
path = "tests/integration/credential_test.rs"

[[test]]
name = "escape_test"
path = "tests/integration/escape_test.rs"

[[test]]
name = "nfs3_protocol_test"
path = "tests/integration/nfs3_protocol_test.rs"

[[test]]
name = "scan_test"
path = "tests/integration/scan_test.rs"

[[test]]
name = "xdr_fuzz_test"
path = "tests/integration/xdr_fuzz_test.rs"

